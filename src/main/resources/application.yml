spring:
  datasource:
    url: jdbc:mysql://localhost:3307/foods_drinks_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: app_user
    password: app_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # OAuth2 config — will be enabled on Day 8
  # security:
  #   oauth2:
  #     client:
  #       registration:
  #         google:
  #           client-id: YOUR_GOOGLE_CLIENT_ID
  #           client-secret: YOUR_GOOGLE_CLIENT_SECRET
  #           scope: email, profile
  #         facebook:
  #           client-id: YOUR_FACEBOOK_CLIENT_ID
  #           client-secret: YOUR_FACEBOOK_CLIENT_SECRET
  #           scope: email, public_profile
  #         twitter:
  #           client-id: YOUR_TWITTER_CLIENT_ID
  #           client-secret: YOUR_TWITTER_CLIENT_SECRET
  #           provider: twitter
  #       provider:
  #         twitter:
  #           authorization-uri: https://twitter.com/i/oauth2/authorize
  #           token-uri: https://api.twitter.com/2/oauth2/token
  #           user-info-uri: https://api.twitter.com/2/users/me
  #           user-name-attribute: data

  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_EMAIL@gmail.com
    password: YOUR_APP_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: YOUR_JWT_SECRET_KEY_MUST_BE_AT_LEAST_32_CHARACTERS_LONG
    expiration-ms: 86400000 # 24 hours
  upload:
    dir: uploads/
  slack:
    webhook-url: YOUR_SLACK_WEBHOOK_URL
  admin:
    # Set create=true to bootstrap the admin account on startup.
    # Override email/password via env vars (APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD) in production.
    create: true
    email: admin@foodsdrinks.com
    password: Admin@123456
