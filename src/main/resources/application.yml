spring:
  datasource:
    url: jdbc:mysql://localhost:3307/foods_drinks_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: app_user
    password: app_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # OAuth2 Social Login — Day 8
  # Replace placeholder values with real credentials from each provider's developer console.
  # Google:   https://console.cloud.google.com/apis/credentials
  # Facebook: https://developers.facebook.com/apps
  # Apple:    https://developer.apple.com/account/resources/identifiers/list/serviceId
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
            # scope handled in OAuth2ClientConfig
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:YOUR_FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET:YOUR_FACEBOOK_CLIENT_SECRET}
            # scope + userInfoUri handled in OAuth2ClientConfig
          apple:
            # Services ID (e.g. com.yourcompany.app) — NOT the App ID
            client-id: ${APPLE_CLIENT_ID:YOUR_APPLE_SERVICE_ID}
            # client-secret is generated at runtime by AppleClientSecretGenerator (ES256 JWT)
            client-secret: PLACEHOLDER_GENERATED_AT_RUNTIME

  mail:
    host: smtp.gmail.com
    port: 587
    username: YOUR_EMAIL@gmail.com
    password: YOUR_APP_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: YOUR_JWT_SECRET_KEY_MUST_BE_AT_LEAST_32_CHARACTERS_LONG
    expiration-ms: 86400000 # 24 hours
  upload:
    dir: uploads/
  slack:
    webhook-url: YOUR_SLACK_WEBHOOK_URL
  # OAuth2 redirect — where the browser is sent after social login with ?token=<jwt>
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:8080/oauth2/callback}
  # Apple Sign In credentials
  # team-id:    10-character Team ID from Apple Developer portal (e.g. AB12CD34EF)
  # key-id:     Key ID printed in the .p8 file header (e.g. ABCDE12345)
  # private-key: full PEM content of your .p8 file (multiline OK in YAML)
  apple:
    team-id: ${APPLE_TEAM_ID:YOUR_APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID:YOUR_APPLE_KEY_ID}
    private-key: ${APPLE_PRIVATE_KEY:YOUR_APPLE_PRIVATE_KEY}
  admin:
    # Set create=true to bootstrap the admin account on startup.
    # Override email/password via env vars (APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD) in production.
    create: true
    email: admin@foodsdrinks.com
    password: Admin@123456

logging:
  level:
    com.fooddrinks.service.impl.CustomOAuth2UserService: DEBUG
    com.fooddrinks.service.impl.CustomOidcUserService: DEBUG
