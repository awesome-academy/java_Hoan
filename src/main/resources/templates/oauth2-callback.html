<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAuth2 Callback — Foods &amp; Drinks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container" style="max-width: 640px; margin-top: 80px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">

      <!-- Error state: server-side, OAuth2FailureHandler sends ?error= as query param -->
      <div th:if="${error}">
        <h4 class="text-danger mb-3">&#10060; OAuth2 Login Failed</h4>
        <div class="alert alert-danger" th:text="${error}"></div>
        <a href="/" class="btn btn-outline-secondary btn-sm">Back to Home</a>
      </div>

      <!-- Success/no-token state: token arrives via URL fragment #token=..., read by JS below -->
      <div th:unless="${error}">
        <div id="loadingSection" class="text-muted">Loading&hellip;</div>

        <div id="noTokenSection" style="display:none">
          <h4 class="text-warning mb-3">&#9888; No Token Received</h4>
          <p class="text-muted">OAuth2 callback reached but no token was found.</p>
          <a href="/" class="btn btn-outline-secondary btn-sm">Back to Home</a>
        </div>

        <div id="successSection" style="display:none">
          <h4 class="text-success mb-1">&#10003; OAuth2 Login Successful</h4>
          <p class="text-muted small mb-4">Foods &amp; Drinks — Local Test</p>

          <div class="mb-3">
            <label class="form-label fw-semibold">Logged in as</label>
            <div id="emailField" class="form-control bg-light"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">JWT Token <span class="text-muted fw-normal">(copy for Postman)</span></label>
            <textarea id="tokenField" class="form-control font-monospace" rows="4" readonly></textarea>
          </div>

          <button class="btn btn-primary btn-sm"
                  onclick="navigator.clipboard.writeText(document.getElementById('tokenField').value)
                           .then(() => this.textContent = 'Copied!')
                           .catch(() => this.textContent = 'Copy failed')">
            Copy Token
          </button>

          <div class="mt-3">
            <small class="text-muted">
              Use as: <code class="text-body">Authorization: Bearer &lt;token&gt;</code>
            </small>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script th:unless="${error}">
  (function () {
    // Token is delivered via URL fragment (#token=...) — never sent to server
    var hash = window.location.hash.substring(1);
    var params = new URLSearchParams(hash);
    var token = params.get('token');

    document.getElementById('loadingSection').style.display = 'none';

    if (!token) {
      document.getElementById('noTokenSection').style.display = 'block';
      return;
    }

    // Decode JWT payload (base64url) client-side to extract subject (email)
    try {
      var payloadB64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      var payload = JSON.parse(atob(payloadB64));
      document.getElementById('emailField').textContent = payload.sub || '(unknown)';
    } catch (e) {
      document.getElementById('emailField').textContent = '(could not decode)';
    }

    document.getElementById('tokenField').value = token;
    document.getElementById('successSection').style.display = 'block';

    // Remove fragment from URL bar without reloading the page
    history.replaceState(null, '', window.location.pathname + window.location.search);
  })();
</script>

</body>
</html>
