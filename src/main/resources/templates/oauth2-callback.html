<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAuth2 Callback — Foods &amp; Drinks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container" style="max-width: 640px; margin-top: 80px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">

      <!-- Error state -->
      <div th:if="${error}">
        <h4 class="text-danger mb-3">&#10060; OAuth2 Login Failed</h4>
        <div class="alert alert-danger">
          <span th:text="${error}"></span>
        </div>
        <a href="/" class="btn btn-outline-secondary btn-sm">Back to Home</a>
      </div>

      <!-- No token state -->
      <div th:if="${token == null and error == null}">
        <h4 class="text-warning mb-3">&#9888; No Token Received</h4>
        <p class="text-muted">OAuth2 callback was reached but no token was provided.</p>
        <a href="/" class="btn btn-outline-secondary btn-sm">Back to Home</a>
      </div>

      <!-- Success state -->
      <div th:if="${token != null}">
        <h4 class="text-success mb-1">&#10003; OAuth2 Login Successful</h4>
        <p class="text-muted small mb-4">Foods &amp; Drinks — Local Test</p>

        <div class="mb-3">
          <label class="form-label fw-semibold">Logged in as</label>
          <div class="form-control bg-light" th:text="${email}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">JWT Token <span class="text-muted fw-normal">(copy for Postman)</span></label>
          <textarea id="tokenField" class="form-control font-monospace"
                    rows="4" readonly th:text="${token}"></textarea>
        </div>

        <button class="btn btn-primary btn-sm"
                onclick="navigator.clipboard.writeText(document.getElementById('tokenField').value)
                         .then(() => this.textContent = 'Copied!')
                         .catch(() => this.textContent = 'Copy failed')">
          Copy Token
        </button>

        <div class="mt-3">
          <small class="text-muted">
            Use as: <code class="text-body">Authorization: Bearer &lt;token&gt;</code>
          </small>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
