<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login — Foods &amp; Drinks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f5f5; }
    .login-card { max-width: 400px; margin: 80px auto; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="card-title mb-1 text-center fw-bold">🍔 Admin Panel</h4>
      <p class="text-center text-muted small mb-4">Foods &amp; Drinks</p>

      <div th:if="${param.error}" class="alert alert-danger py-2 small">
        Invalid email or password, or account not authorized.
      </div>
      <div th:if="${param.logout}" class="alert alert-success py-2 small">
        You have been logged out.
      </div>
      <div th:if="${param.denied}" class="alert alert-warning py-2 small">
        Access denied. Admin account required.
      </div>

      <form th:action="@{/admin/login}" method="post">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="username" class="form-control"
                 placeholder="admin@example.com" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control"
                 placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
