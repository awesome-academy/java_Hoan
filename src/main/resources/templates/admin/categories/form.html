<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle + ' — Admin'}">Category Form — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
  <div class="row">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/admin/categories}" class="btn btn-sm btn-outline-secondary">← Back</a>
        <h5 class="mb-0 fw-bold" th:text="${pageTitle}">Category Form</h5>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="card shadow-sm" style="max-width:560px">
        <div class="card-body">
          <form th:action="@{${formAction}}" th:object="${category}" method="post">
            <div class="mb-3">
              <label class="form-label">Name <span class="text-danger">*</span></label>
              <input type="text" th:field="*{name}" class="form-control"
                     th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" required>
              <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary">Save</button>
              <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
