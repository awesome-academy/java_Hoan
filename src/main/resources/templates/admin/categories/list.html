<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Categories — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
  <div class="row">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 fw-bold">Categories</h5>
        <a th:href="@{/admin/categories/new}" class="btn btn-primary btn-sm">+ New Category</a>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>#ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="cat : ${categories}">
                <td th:text="${cat.id}"></td>
                <td th:text="${cat.name}"></td>
                <td th:text="${cat.description ?: '—'}"></td>
                <td th:text="${#temporals.format(cat.createdAt, 'yyyy-MM-dd')}"></td>
                <td class="d-flex gap-1">
                  <a th:href="@{/admin/categories/{id}/edit(id=${cat.id})}"
                     class="btn btn-sm btn-outline-primary">Edit</a>
                  <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post"
                        onsubmit="return confirm('Delete this category? This cannot be undone.')">
                    <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="5" class="text-center text-muted py-3">No categories yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
