<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
  <div class="row">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 fw-bold">Users</h5>
        <span class="text-muted small" th:text="|Total: ${users.totalElements}|"></span>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>#ID</th>
                <th>Email</th>
                <th>Full Name</th>
                <th>Role</th>
                <th>Provider</th>
                <th>Status</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="user : ${users.content}">
                <td th:text="${user.id}"></td>
                <td>
                  <a th:href="@{/admin/users/{id}(id=${user.id})}" th:text="${user.email}"></a>
                </td>
                <td th:text="${user.fullName}"></td>
                <td>
                  <span th:text="${user.role}"
                        th:class="${user.role.name() == 'ADMIN'} ? 'badge bg-danger' : 'badge bg-secondary'">
                  </span>
                </td>
                <td th:text="${user.provider}"></td>
                <td>
                  <span th:if="${user.isActive}" class="badge bg-success">Active</span>
                  <span th:unless="${user.isActive}" class="badge bg-secondary">Inactive</span>
                </td>
                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}"></td>
                <td>
                  <form th:action="@{/admin/users/{id}/toggle-active(id=${user.id})}" method="post" style="display:inline">
                    <button th:if="${user.isActive}" type="submit"
                            class="btn btn-sm btn-outline-warning"
                            onclick="return confirm('Deactivate this user?')">Deactivate</button>
                    <button th:unless="${user.isActive}" type="submit"
                            class="btn btn-sm btn-outline-success">Activate</button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(users.content)}">
                <td colspan="8" class="text-center text-muted py-3">No users found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="mt-3">
        <div th:replace="~{fragments/layout :: pagination(${users}, '/admin/users')}"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
