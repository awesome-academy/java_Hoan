<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Detail — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
  <div class="row">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/admin/users}" class="btn btn-sm btn-outline-secondary">← Back</a>
        <h5 class="mb-0 fw-bold">User Detail</h5>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="card shadow-sm" style="max-width:600px">
        <div class="card-body">
          <dl class="row mb-0">
            <dt class="col-sm-4">ID</dt>
            <dd class="col-sm-8" th:text="${user.id}"></dd>

            <dt class="col-sm-4">Email</dt>
            <dd class="col-sm-8" th:text="${user.email}"></dd>

            <dt class="col-sm-4">Full Name</dt>
            <dd class="col-sm-8" th:text="${user.fullName}"></dd>

            <dt class="col-sm-4">Phone</dt>
            <dd class="col-sm-8" th:text="${user.phone ?: '—'}"></dd>

            <dt class="col-sm-4">Address</dt>
            <dd class="col-sm-8" th:text="${user.address ?: '—'}"></dd>

            <dt class="col-sm-4">Role</dt>
            <dd class="col-sm-8">
              <span th:text="${user.role}"
                    th:class="${user.role.name() == 'ADMIN'} ? 'badge bg-danger' : 'badge bg-secondary'">
              </span>
            </dd>

            <dt class="col-sm-4">Provider</dt>
            <dd class="col-sm-8" th:text="${user.provider}"></dd>

            <dt class="col-sm-4">Email Verified</dt>
            <dd class="col-sm-8">
              <span th:text="${user.emailVerified ? 'Yes' : 'No'}"
                    th:class="${user.emailVerified} ? 'badge bg-success' : 'badge bg-secondary'">
              </span>
            </dd>

            <dt class="col-sm-4">Status</dt>
            <dd class="col-sm-8">
              <span th:text="${user.isActive ? 'Active' : 'Inactive'}"
                    th:class="${user.isActive} ? 'badge bg-success' : 'badge bg-secondary'">
              </span>
            </dd>

            <dt class="col-sm-4">Created At</dt>
            <dd class="col-sm-8" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></dd>

            <dt class="col-sm-4">Updated At</dt>
            <dd class="col-sm-8" th:text="${#temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm')}"></dd>
          </dl>
        </div>
        <div class="card-footer bg-transparent d-flex gap-2">
          <form th:action="@{/admin/users/{id}/toggle-active(id=${user.id})}" method="post">
            <button type="submit"
                    th:text="${user.isActive ? 'Deactivate' : 'Activate'}"
                    th:class="${user.isActive} ? 'btn btn-warning btn-sm' : 'btn btn-success btn-sm'">
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
