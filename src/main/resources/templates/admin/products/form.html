<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${pageTitle + ' — Admin'}">Product Form — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
  <div class="row">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/admin/products}" class="btn btn-sm btn-outline-secondary">← Back</a>
        <h5 class="mb-0 fw-bold" th:text="${pageTitle}">Product Form</h5>
        <span th:if="${productDetail != null}"
              th:text="${productDetail.isActive ? 'Active' : 'Inactive'}"
              th:class="${productDetail?.isActive} ? 'badge bg-success' : 'badge bg-secondary'">
        </span>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="row">
        <!-- Product form -->
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-header fw-semibold">Product Info</div>
            <div class="card-body">
              <form th:action="@{${formAction}}" th:object="${product}" method="post">
                <div class="mb-3">
                  <label class="form-label">Name <span class="text-danger">*</span></label>
                  <input type="text" th:field="*{name}" class="form-control"
                         th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" required>
                  <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Description</label>
                  <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <div class="row mb-3">
                  <div class="col">
                    <label class="form-label">Price (VND) <span class="text-danger">*</span></label>
                    <input type="number" th:field="*{price}" class="form-control" step="1000" min="1000"
                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" required>
                    <div class="invalid-feedback" th:errors="*{price}"></div>
                  </div>
                  <div class="col">
                    <label class="form-label">Stock</label>
                    <input type="number" th:field="*{stockQuantity}" class="form-control" min="0">
                  </div>
                </div>

                <div class="row mb-3">
                  <div class="col">
                    <label class="form-label">Type <span class="text-danger">*</span></label>
                    <select th:field="*{type}" class="form-select"
                            th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'" required>
                      <option value="">-- Select --</option>
                      <option th:each="t : ${productTypes}" th:value="${t}" th:text="${t}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{type}"></div>
                  </div>
                  <div class="col">
                    <label class="form-label">Category</label>
                    <select th:field="*{categoryId}" class="form-select">
                      <option value="">-- None --</option>
                      <option th:each="cat : ${categories}"
                              th:value="${cat.id}"
                              th:text="${cat.name}">
                      </option>
                    </select>
                  </div>
                </div>

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary">Save</button>
                  <a th:href="@{/admin/products}" class="btn btn-outline-secondary">Cancel</a>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Image management (only on edit page) -->
        <div class="col-md-6" th:if="${productId != null}">
          <div class="card shadow-sm">
            <div class="card-header fw-semibold">Images</div>
            <div class="card-body">
              <!-- Upload new image -->
              <form th:action="@{/admin/products/{id}/images(id=${productId})}"
                    method="post" enctype="multipart/form-data" class="mb-3">
                <div class="input-group">
                  <input type="file" name="file" class="form-control" accept="image/*" required>
                  <div class="input-group-text">
                    <input class="form-check-input me-1" type="checkbox" name="primary" value="true" id="primaryCheck">
                    <label class="form-check-label" for="primaryCheck">Primary</label>
                  </div>
                  <button type="submit" class="btn btn-outline-primary">Upload</button>
                </div>
              </form>

              <!-- Existing images -->
              <div th:if="${productDetail != null and !#lists.isEmpty(productDetail.images)}">
                <div class="row g-2">
                  <div class="col-6" th:each="img : ${productDetail.images}">
                    <div class="card border">
                      <img th:src="${img.imageUrl}" class="card-img-top" style="height:120px;object-fit:cover" alt="product image">
                      <div class="card-body p-2 d-flex justify-content-between align-items-center">
                        <span th:if="${img.isPrimary}" class="badge bg-warning text-dark">Primary</span>
                        <span th:unless="${img.isPrimary}" class="text-muted small">—</span>
                        <form th:action="@{/admin/products/{id}/images/{imgId}/delete(id=${productId},imgId=${img.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this image?')">
                          <button type="submit" class="btn btn-sm btn-outline-danger">✕</button>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <p th:if="${productDetail == null or #lists.isEmpty(productDetail.images)}"
                 class="text-muted small">No images yet.</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
