<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
  <div class="row">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 fw-bold">Products</h5>
        <a th:href="@{/admin/products/new}" class="btn btn-primary btn-sm">+ New Product</a>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>#ID</th>
                <th>Name</th>
                <th>Type</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Category</th>
                <th>Rating</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${products.content}">
                <td th:text="${p.id}"></td>
                <td>
                  <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" th:text="${p.name}"></a>
                </td>
                <td th:text="${p.type}"></td>
                <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')}"></td>
                <td th:text="${p.stockQuantity}"></td>
                <td th:text="${p.categoryName ?: '—'}"></td>
                <td th:text="${p.averageRating}">★</td>
                <td>
                  <span th:text="${p.isActive ? 'Active' : 'Inactive'}"
                        th:class="${p.isActive} ? 'badge bg-success' : 'badge bg-secondary'">
                  </span>
                </td>
                <td class="d-flex gap-1 flex-wrap">
                  <a th:href="@{/admin/products/{id}/edit(id=${p.id})}"
                     class="btn btn-sm btn-outline-primary">Edit</a>
                  <form th:if="${p.isActive}"
                        th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post"
                        onsubmit="return confirm('Deactivate this product?')">
                    <button type="submit" class="btn btn-sm btn-outline-warning">Deactivate</button>
                  </form>
                  <form th:unless="${p.isActive}"
                        th:action="@{/admin/products/{id}/restore(id=${p.id})}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-success">Restore</button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(products.content)}">
                <td colspan="9" class="text-center text-muted py-3">No products found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="mt-3">
        <div th:replace="~{fragments/layout :: pagination(${products}, '/admin/products')}"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
