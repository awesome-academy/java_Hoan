<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|Suggestion #${suggestion.id} — Admin|">Suggestion Detail — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
  <div class="row">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/admin/suggestions}" class="btn btn-sm btn-outline-secondary">← Back</a>
        <h5 class="mb-0 fw-bold" th:text="|Suggestion #${suggestion.id}|">Suggestion Detail</h5>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="row g-3">
        <!-- Suggestion Info -->
        <div class="col-md-7">
          <div class="card shadow-sm h-100">
            <div class="card-header fw-semibold">Suggestion Details</div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Product Name</span>
                <strong th:text="${suggestion.name}"></strong>
              </li>
              <li class="list-group-item">
                <div class="text-muted small mb-1">Description</div>
                <div th:text="${suggestion.description ?: '—'}"></div>
              </li>
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Status</span>
                <span th:text="${suggestion.status}"
                      th:classappend="${suggestion.status.name() == 'PENDING' ? 'bg-warning text-dark'
                                    : suggestion.status.name() == 'REVIEWED' ? 'bg-info text-dark'
                                    : suggestion.status.name() == 'APPROVED' ? 'bg-success'
                                    : 'bg-danger'}"
                      class="badge fs-6">
                </span>
              </li>
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Submitted</span>
                <span th:text="${#temporals.format(suggestion.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
              </li>
            </ul>
          </div>
        </div>

        <!-- User Info + Status Update -->
        <div class="col-md-5 d-flex flex-column gap-3">
          <div class="card shadow-sm">
            <div class="card-header fw-semibold">Submitted By</div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Name</span>
                <span th:text="${suggestion.userFullName}"></span>
              </li>
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Email</span>
                <a th:href="@{/admin/users/{id}(id=${suggestion.userId})}"
                   th:text="${suggestion.userEmail}"></a>
              </li>
            </ul>
          </div>

          <!-- Status Update Form -->
          <div class="card shadow-sm">
            <div class="card-header fw-semibold">Update Status</div>
            <div class="card-body">
              <form th:action="@{/admin/suggestions/{id}/status(id=${suggestion.id})}" method="post" class="d-flex gap-2">
                <select name="status" class="form-select form-select-sm">
                  <option th:each="s : ${allStatuses}"
                          th:value="${s}"
                          th:text="${s}"
                          th:selected="${s == suggestion.status}">
                  </option>
                </select>
                <button type="submit" class="btn btn-primary btn-sm text-nowrap">Update</button>
              </form>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
