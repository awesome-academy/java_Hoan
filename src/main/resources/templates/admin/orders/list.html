<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
  <div class="row">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <h5 class="mb-3 fw-bold">🧾 Orders</h5>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>#ID</th>
                <th>User</th>
                <th>Total (₫)</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="order : ${orders.content}">
                <td th:text="${order.id}"></td>
                <td>
                  <div th:text="${order.userFullName}" class="fw-semibold"></div>
                  <div th:text="${order.userEmail}" class="text-muted small"></div>
                </td>
                <td th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 0, 'POINT')}"></td>
                <td>
                  <span th:text="${order.status}"
                        th:classappend="${order.status.name() == 'PENDING' ? 'bg-warning text-dark'
                                      : order.status.name() == 'CONFIRMED' ? 'bg-info text-dark'
                                      : order.status.name() == 'DELIVERING' ? 'bg-primary'
                                      : order.status.name() == 'COMPLETED' ? 'bg-success'
                                      : 'bg-danger'}"
                        class="badge">
                  </span>
                </td>
                <td th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                  <a th:href="@{/admin/orders/{id}(id=${order.id})}"
                     class="btn btn-sm btn-outline-primary">View</a>
                </td>
              </tr>
              <tr th:if="${orders.content.isEmpty()}">
                <td colspan="6" class="text-center text-muted py-3">No orders yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="mt-3">
        <div th:replace="~{fragments/layout :: pagination(${orders}, '/admin/orders')}"></div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
