<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|Order #${order.id} — Admin|">Order Detail — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container-fluid">
  <div class="row">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="col-md-10 p-4">
      <div class="d-flex align-items-center gap-2 mb-3">
        <a th:href="@{/admin/orders}" class="btn btn-sm btn-outline-secondary">← Back</a>
        <h5 class="mb-0 fw-bold" th:text="|Order #${order.id}|">Order Detail</h5>
      </div>

      <div th:replace="~{fragments/layout :: alerts}"></div>

      <div class="row g-3">
        <!-- Order Info -->
        <div class="col-md-6">
          <div class="card shadow-sm h-100">
            <div class="card-header fw-semibold">Order Info</div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Status</span>
                <span th:text="${order.status}"
                      th:classappend="${order.status.name() == 'PENDING' ? 'bg-warning text-dark'
                                    : order.status.name() == 'CONFIRMED' ? 'bg-info text-dark'
                                    : order.status.name() == 'DELIVERING' ? 'bg-primary'
                                    : order.status.name() == 'COMPLETED' ? 'bg-success'
                                    : 'bg-danger'}"
                      class="badge fs-6">
                </span>
              </li>
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Total</span>
                <strong th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 0, 'POINT') + ' ₫'}"></strong>
              </li>
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Shipping Address</span>
                <span th:text="${order.shippingAddress}"></span>
              </li>
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Note</span>
                <span th:text="${order.note ?: '—'}"></span>
              </li>
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Created</span>
                <span th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
              </li>
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Updated</span>
                <span th:text="${#temporals.format(order.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
              </li>
            </ul>
          </div>
        </div>

        <!-- Customer Info + Status Update -->
        <div class="col-md-6 d-flex flex-column gap-3">
          <div class="card shadow-sm">
            <div class="card-header fw-semibold">Customer</div>
            <ul class="list-group list-group-flush">
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Name</span>
                <span th:text="${order.userFullName}"></span>
              </li>
              <li class="list-group-item d-flex justify-content-between">
                <span class="text-muted">Email</span>
                <a th:href="@{/admin/users/{id}(id=${order.userId})}"
                   th:text="${order.userEmail}"></a>
              </li>
            </ul>
          </div>

          <!-- Status Update Form — disabled for terminal states -->
          <div class="card shadow-sm">
            <div class="card-header fw-semibold">Update Status</div>
            <div class="card-body">
              <th:block th:if="${order.status.name() == 'COMPLETED' or order.status.name() == 'CANCELLED'}">
                <p class="text-muted mb-0">This order is in a terminal state (<span th:text="${order.status}"></span>) and cannot be changed.</p>
              </th:block>
              <th:block th:unless="${order.status.name() == 'COMPLETED' or order.status.name() == 'CANCELLED'}">
                <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="d-flex gap-2">
                  <select name="status" class="form-select form-select-sm">
                    <option th:each="s : ${allowedStatuses}"
                            th:value="${s}"
                            th:text="${s}"
                            th:selected="${s == order.status}">
                    </option>
                  </select>
                  <button type="submit" class="btn btn-primary btn-sm text-nowrap">Update</button>
                </form>
              </th:block>
            </div>
          </div>
        </div>
      </div>

      <!-- Order Items -->
      <div class="card shadow-sm mt-3">
        <div class="card-header fw-semibold">Items</div>
        <div class="table-responsive">
          <table class="table table-sm align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Product</th>
                <th>Unit Price (₫)</th>
                <th>Qty</th>
                <th>Subtotal (₫)</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${order.items}">
                <td th:text="${item.productName}"></td>
                <td th:text="${#numbers.formatDecimal(item.productPrice, 1, 'COMMA', 0, 'POINT')}"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${#numbers.formatDecimal(item.subtotal, 1, 'COMMA', 0, 'POINT')}"></td>
              </tr>
            </tbody>
            <tfoot class="table-light">
              <tr>
                <td colspan="3" class="text-end fw-bold">Total</td>
                <td class="fw-bold" th:text="${#numbers.formatDecimal(order.totalAmount, 1, 'COMMA', 0, 'POINT') + ' ₫'}"></td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
